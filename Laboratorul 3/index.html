<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piatra, Hârtia, Foarfeca</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #333;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        #newGame {
            background: #777;
            margin-top: 15px;
        }

        .result-box {
            margin: 20px 0;
            padding: 18px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        #result {
            font-size: 22px;
            font-weight: bold;
        }

        .score {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        #leader {
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎮 Piatra, Hârtia, Foarfeca</h1>

        <p>Alege o variantă și joacă împotriva calculatorului!</p>

        <div class="buttons">
            <button id="rock">Piatra</button>
            <button id="paper">Hârtia</button>
            <button id="scissors">Foarfeca</button>
        </div>

        <div class="result-box">

            <p>
                <strong>Alegerea ta:</strong>
                <span id="playerChoice">-</span>
            </p>

            <p>
                <strong>Alegerea calculatorului:</strong>
                <span id="computerChoice">-</span>
            </p>

            <p id="result">
                Alege o variantă pentru a începe!
            </p>

            <p id="leader"></p>

        </div>

        <div class="score">

            <p>Scor:</p>

            <p>
                Tu:
                <span id="playerScore">0</span>
                |
                Calculator:
                <span id="computerScore">0</span>
                |
                Egalități:
                <span id="draws">0</span>
            </p>

            <p>
                Runde jucate:
                <span id="rounds">0</span>
            </p>

        </div>

        <button id="newGame">Joc nou</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
